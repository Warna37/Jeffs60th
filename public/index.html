<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050c1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ponz's 60th Round</title>
<style>
:root{--bg:#050c1f;--card:#0b1735;--card2:#12224b;--line:#1f3366;--tx:#f2f5fb;--mut:#92a4cf;--gold:#e8b84a;--a:#f0b94a;--b:#5ec4e8;--ok:#5fd68a;--bad:#ff7b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:90px}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:rgba(5,12,31,.96);backdrop-filter:blur(8px);padding:0 14px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:18px;margin:0;flex:1;letter-spacing:.2px}
.top small{display:block;color:var(--mut);font-size:12px;font-weight:400}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}.dot.off{background:#e0a030}
.gear{background:none;border:0;color:var(--mut);font-size:22px;padding:4px 6px}
.tabs{display:flex}
.tabs button{flex:1;white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font-size:15px;font-weight:600;padding:10px 0}
.tabs button.on{color:var(--gold);border-color:var(--gold)}
main{padding:14px 12px 0;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;text-align:center}
.vs .t{padding:6px 2px;border-radius:12px}
.vs .nm{font-weight:700;font-size:14px;color:var(--mut)}
.vs .big{font-size:40px;font-weight:800;line-height:1.1}
.vs .sub{font-size:12px;color:var(--mut)}
.vs .mid{color:var(--mut);font-size:12px;font-weight:700}
.A{color:var(--a)}.B{color:var(--b)}
.lead{outline:2px solid var(--gold);background:rgba(232,184,74,.08)}
.status{text-align:center;margin-top:8px;font-weight:700;color:var(--gold)}
.holebar{display:flex;align-items:center;gap:8px}
.holebar .nav{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:22px}
.holebar .info{flex:1;text-align:center}
.holebar .hn{font-size:26px;font-weight:800}
.holebar .hi{color:var(--mut);font-size:13px}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:10px}
.strip button{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:700;font-size:13px}
.strip button.part{background:#4b3d14;color:#f7d98a;border-color:#7a6320}
.strip button.done{background:#1f6b3f;color:#fff;border-color:#2e8d56}
.strip button.cur{outline:2px solid var(--gold);outline-offset:1px}
.tc h3{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.tc h3 span{font-size:12px;color:var(--mut);font-weight:500}
.prow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.pn{flex:1;min-width:0}
.pn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn i{font-style:normal;font-size:12px;color:var(--gold)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:24px;font-weight:700}
.step button:active{background:#2f4a9a}
.step .val{width:48px;text-align:center;font-size:28px;font-weight:800;background:none;border:0;color:var(--tx)}
.step .val.blank{opacity:.3}
.bigbtn{display:block;width:100%;padding:15px;border-radius:14px;border:0;background:var(--gold);color:#241a00;font-size:17px;font-weight:800;margin-top:4px}
.bigbtn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%}
.lb td,.lb th{padding:9px 6px;text-align:right;border-top:1px solid var(--line);font-size:15px}
.lb th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;border-top:0}
.lb td:first-child,.lb th:first-child{text-align:left;width:28px;color:var(--mut)}
.lb td:nth-child(2),.lb th:nth-child(2){text-align:left}
.lb .nm{font-weight:700}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px;margin-left:6px;vertical-align:1px}
.tag.A{background:rgba(240,185,74,.18)}.tag.B{background:rgba(94,196,232,.18)}
.neg{color:var(--ok)}.pos{color:#f3cfc9}
details{margin-top:6px}
summary{cursor:pointer;color:var(--gold);font-weight:700;padding:6px 0}
.sc{overflow-x:auto;margin-top:6px}
.sc table{min-width:760px}
.sc td,.sc th{padding:6px 4px;text-align:center;font-size:13px;border:1px solid var(--line)}
.sc th{color:var(--mut);background:var(--card2)}
.sc td:first-child,.sc th:first-child{position:sticky;left:0;background:var(--card2);text-align:left;min-width:84px;z-index:1}
.sc .u{color:var(--ok);font-weight:800}.sc .o{color:#f3cfc9}
.sc .tm td{background:rgba(232,184,74,.1);font-weight:800}
.sc sup{color:var(--gold)}
.muted{color:var(--mut);font-size:13px}
.pair{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.pair:first-of-type{border-top:0}
.pair .r{width:24px;color:var(--mut);font-weight:700}
.pair .n{flex:1;font-weight:700}.pair .n small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.pair .s{text-align:right;font-weight:800;font-size:20px}.pair .s small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:50}
.ov{position:fixed;inset:0;background:rgba(2,6,18,.97);z-index:40;padding:30px 20px;overflow:auto}
.ov h2{text-align:center;color:var(--gold);font-size:22px}
.pr{opacity:0;transform:translateY(12px);animation:in .6s forwards;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px auto;max-width:420px;font-size:19px;font-weight:700;text-align:center}
@keyframes in{to{opacity:1;transform:none}}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;background:#07102a;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prs{display:grid;grid-template-columns:1fr 78px 70px;gap:6px;margin-bottom:6px}
.hs{display:grid;grid-template-columns:36px 1fr 1fr;gap:6px;margin-bottom:5px;align-items:center}
.danger{background:#5a1d17;color:#ffd9d3;border:1px solid #8a2e25}
.demo{background:#3b2f0a;color:#f6d98c;text-align:center;font-size:12px;padding:5px}
.bday{position:relative;overflow:hidden;border-radius:0 0 22px 22px;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;margin-bottom:0;border-top:0;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#0d1d4a 0%,#162b66 55%,#0d1d4a 100%);border:1px solid #6b5a22;box-shadow:0 0 0 1px rgba(232,184,74,.15),0 10px 30px rgba(0,0,0,.4)}
.bday .b60{font-size:78px;line-height:.9;font-weight:900;letter-spacing:-3px;background:linear-gradient(180deg,#fff0b8,#e8b84a 55%,#b58519);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.bday .bt{flex:1;min-width:0;display:flex;flex-direction:column}
.bday .bt small{letter-spacing:3px;font-size:11px;color:var(--gold);font-weight:700}
.bday .bt b{font-size:38px;line-height:1.1;font-weight:900;letter-spacing:1.5px;background:linear-gradient(180deg,#fff0b8,#e8b84a 55%,#b58519);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.bday .bt span{font-size:12px;color:var(--mut);margin-top:3px}
.bday .flag{width:34px;height:48px;flex:none;opacity:.95;margin-top:22px}
.bday .cf{position:absolute;inset:0;pointer-events:none;background:
radial-gradient(circle at 8% 20%,#e8b84a 0 3px,transparent 4px),radial-gradient(circle at 22% 78%,#fff 0 2px,transparent 3px),radial-gradient(circle at 38% 12%,#5ec4e8 0 2.5px,transparent 3.5px),radial-gradient(circle at 55% 85%,#e8b84a 0 2px,transparent 3px),radial-gradient(circle at 70% 15%,#fff 0 2px,transparent 3px),radial-gradient(circle at 86% 70%,#5ec4e8 0 3px,transparent 4px),radial-gradient(circle at 94% 18%,#e8b84a 0 2.5px,transparent 3.5px),radial-gradient(circle at 47% 45%,#fff 0 1.5px,transparent 2.5px);animation:tw 3.2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35;transform:translateY(0)}to{opacity:1;transform:translateY(3px)}}
.bctl{position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;display:flex;align-items:center;gap:6px}
.bday.sm{padding:10px 14px;gap:10px}.bday.sm .b60{font-size:40px;letter-spacing:-2px}.bday.sm .bt b{font-size:20px}.bday.sm .bt small{font-size:10px}.bday.sm .bt span,.bday.sm .flag{display:none}
.bimg{position:relative;padding:calc(8px + env(safe-area-inset-top)) 8px 0;background:var(--bg)}
.bimg img{display:block;width:100%;height:auto;border-radius:16px}
.bimg .bctl{top:calc(18px + env(safe-area-inset-top));right:18px;background:rgba(5,12,31,.78);border-radius:99px;padding:3px 8px}
.bimg .gear{color:#fff;padding:2px 4px;font-size:20px}
.clg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px 6px}.clg label{display:flex;align-items:center;gap:6px;margin:0;color:var(--tx);font-size:15px}.clg input{width:20px;height:20px;padding:0}
.strip button.closed{opacity:.25;text-decoration:line-through}
</style>
</head>
<body>
<div id="demoBar"></div>
<div id="banner"></div>
<header>
  <div class="tabs"><button data-act="tab" data-t="match" id="tMatch">Matches</button><button data-act="tab" data-t="board" id="tBoard">Leaderboard</button><button data-act="tab" data-t="results" id="tResults">Results</button></div>
</header>
<main id="app"></main>
<div id="over"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF=()=>({title:"Ponz's 60th Round",honoree:'Ponz',cap:true,closed:[],sub:'',course:'Turtle Creek Club (Blue)',teams:[{id:'A',name:'Team A'},{id:'B',name:'Team B'}],
  pct:100,players:[['Luke','A',8],['Will','A',14],['Chris','A',14],['Mac','A',4],['Kyle','B',0],['Jeff','B',10],['Dickie','B',27],['Chris Vincze','B',14]].map((x,i)=>({id:'p'+(i+1),name:x[0],team:x[1],hcp:x[2]})),
  par:[5, 4, 3, 4, 4, 4, 5, 3, 4, 4, 4, 4, 5, 3, 4, 5, 3, 4],si:[11, 1, 17, 13, 5, 3, 9, 15, 7, 2, 12, 4, 6, 18, 14, 10, 16, 8],yds:[533, 399, 142, 355, 372, 385, 542, 178, 394, 421, 384, 416, 506, 147, 344, 493, 181, 391],pairs:null});

let C=DEF(),S={},ST={pinRequired:false,adminRequired:false,drawRequired:false},demo=false,tab='match',hole=0,view=null,lastSig='',queue=[],flushing=false,flushT,PINS={score:'',admin:'',draw:''};
const sc=pid=>S[pid]||(S[pid]=Array(18).fill(null));
const pl=pid=>C.players.find(p=>p.id===pid);
const tname=id=>(C.teams.find(t=>t.id===id)||{}).name||id;
const fmtP=n=>n===0?'E':n>0?'+'+n:''+n;
const cls=n=>n<0?'neg':n>0?'pos':'';
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}

/* ---------- scoring math ---------- */
function shots(p){return Math.max(0,Math.round((+p.hcp||0)*(C.pct==null?100:C.pct)/100))}
const isOpen=h=>!(C.closed||[]).includes(h);
const OPEN=()=>Array.from({length:18},(_,i)=>i).filter(isOpen);
function eSI(h){return OPEN().sort((a,b)=>C.si[a]-C.si[b]).indexOf(h)+1}
function nextOpen(h,d){for(let i=h+d;i>=0&&i<18;i+=d)if(isOpen(i))return i;return null}
function strokes(p,h){if(!isOpen(h))return 0;const x=shots(p),N=OPEN().length||18;return Math.floor(x/N)+(eSI(h)<=x%N?1:0)}
function cap(p,h){return C.cap===false?99:C.par[h]+2+strokes(p,h)}
function gr(p,h){const g=sc(p.id)[h];return g==null?null:Math.min(g,cap(p,h))}
function net(p,h){const g=gr(p,h);return g==null?null:g-strokes(p,h)}
// Team: best 2 net per hole; all players count on holes 9 and 18
function teamCalc(tid){
  const ps=C.players.filter(p=>p.team===tid);let total=0,par=0,n=0,b9=0,h18=0;const holes=[];
  for(let h=0;h<18;h++){
    if(!isOpen(h)){holes.push(null);continue}
    const ns=ps.map(p=>net(p,h));
    if(!ps.length||ns.some(x=>x==null)){holes.push(null);continue}
    const all=h===8||h===17,s=[...ns].sort((a,b)=>a-b),k=all?s.length:Math.min(2,s.length);
    const val=s.slice(0,k).reduce((a,b)=>a+b,0),pp=C.par[h]*k;
    holes.push({val,par:pp,all});total+=val;par+=pp;n++;if(h>=9)b9+=val-pp;if(h===17)h18=val-pp;
  }
  return{total,par,n,diff:total-par,holes,b9,h18};
}
// Blind-draw pair: combined net strokes of both players
function pairCalc(a,b){let total=0,par=0,n=0,b9=0,h18=0;
  for(let h=0;h<18;h++){if(!isOpen(h))continue;const x=net(a,h),y=net(b,h);if(x==null||y==null)continue;total+=x+y;par+=2*C.par[h];n++;if(h>=9)b9+=x+y-2*C.par[h];if(h===17)h18=x+y-2*C.par[h]}
  return{total,par,n,diff:total-par,b9,h18}}
function indCalc(p){let total=0,gross=0,par=0,n=0,b9=0,h18=0;
  for(let h=0;h<18;h++){if(!isOpen(h))continue;const g=gr(p,h);if(g==null)continue;gross+=g;total+=g-strokes(p,h);par+=C.par[h];n++;if(h>=9)b9+=g-strokes(p,h)-C.par[h];if(h===17)h18=g-strokes(p,h)-C.par[h]}
  return{total,gross,par,n,diff:total-par,b9,h18}}
function holeDone(h){return C.players.every(p=>sc(p.id)[h]!=null)}
function holePart(h){return C.players.some(p=>sc(p.id)[h]!=null)}

/* ---------- API (real backend, or local demo when no backend) ---------- */
async function api(path,body){
  if(demo)return demoApi(path,body);
  const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:body?{'content-type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined,cache:'no-store'});
  if(!(r.headers.get('content-type')||'').includes('json'))throw new Error('nojson');
  const j=await r.json();if(!r.ok)throw Object.assign(new Error(j.error||'err'),{status:r.status});return j;
}
function demoLoad(){try{return JSON.parse(localStorage.getItem('r60demo'))||{config:DEF(),scores:{}}}catch(e){return{config:DEF(),scores:{}}}}
function demoApi(path,b){
  const d=demoLoad();
  if(path==='state')return{config:d.config,scores:d.scores,pinRequired:false,adminRequired:false,drawRequired:false};
  if(path==='draw'){const ids=d.config.players.map(p=>p.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}const pr=[];for(let i=0;i+1<ids.length;i+=2)pr.push([ids[i],ids[i+1]]);d.config.pairs=pr;localStorage.setItem('r60demo',JSON.stringify(d));return{ok:true,pairs:pr}}
  if(path==='score'){for(const e of b.entries){(d.scores[e.pid]||(d.scores[e.pid]=Array(18).fill(null)))[e.hole]=e.value}}
  if(path==='config'){b.config.pairs=d.config.pairs;d.config=b.config}
  if(path==='reset'){d.scores={};if(b.pairs)d.config.pairs=null}
  localStorage.setItem('r60demo',JSON.stringify(d));return{ok:true};
}
async function ensure(kind){
  const need=kind==='admin'?ST.adminRequired:kind==='draw'?ST.drawRequired:ST.pinRequired;
  if(demo||!need)return'';
  const key=kind==='admin'?'r60admin':kind==='draw'?'r60draw':'r60pin';
  if(PINS[kind])return PINS[kind];
  let pin=localStorage.getItem(key)||'';
  for(let t=0;t<3;t++){
    const stored=!!pin;
    if(!pin){pin=prompt(kind==='admin'?'Admin PIN':kind==='draw'?'Blind draw PIN':'Scorer PIN')||'';if(!pin)return null}
    try{await api('auth',{pin,kind});localStorage.setItem(key,pin);PINS[kind]=pin;return pin}
    catch(e){
      if(e.status===401){pin='';localStorage.removeItem(key);if(stored&&t===0)continue;alert(/not set/.test(e.message)?e.message:'Wrong PIN');if(/not set/.test(e.message))return null;continue}
      if(stored){PINS[kind]=pin;return pin} // offline: trust saved PIN
      throw e}
  }
  return null;
}

/* ---------- sync ---------- */
let SYNC=true;function setSync(ok){SYNC=ok;const d=$('#dot');if(d)d.className='dot'+(ok?'':' off')}
async function load(){
  try{applyState(await api('state'));setSync(true)}
  catch(e){
    if(e.message==='nojson'||location.protocol==='file:'){demo=true;$('#demoBar').innerHTML='<div class="demo">Demo mode: scores stay on this device until the site is deployed</div>';try{applyState(await api('state'));setSync(true)}catch(_){}}
    else{setSync(false);if(!lastSig){try{const c=JSON.parse(localStorage.getItem('r60cache'));if(c)applyState(c)}catch(_){}}}
  }
}
function applyState(j){
  const sig=JSON.stringify(j);
  ST.pinRequired=j.pinRequired;ST.adminRequired=j.adminRequired;ST.drawRequired=j.drawRequired;
  if(sig===lastSig&&!queue.length)return;
  const first=!lastSig;lastSig=sig;C={...DEF(),...j.config};S=j.scores||{};
  queue.forEach(e=>{sc(e.pid)[e.hole]=e.value});
  try{localStorage.setItem('r60cache',sig)}catch(_){}
  if(first){hole=0;while(hole<17&&(!isOpen(hole)||holeDone(hole)))hole++}
  render();
}
function qpush(e){queue=queue.filter(x=>!(x.pid===e.pid&&x.hole===e.hole));queue.push(e);clearTimeout(flushT);flushT=setTimeout(flush,300)}
async function flush(){
  if(flushing||!queue.length)return;flushing=true;const batch=queue.slice();
  try{await api('score',{pin:PINS.score,entries:batch});queue=queue.filter(x=>!batch.includes(x));setSync(true)}
  catch(e){if(e.status===401){PINS.score='';localStorage.removeItem('r60pin');queue=[];toast('PIN rejected');load()}else setSync(false)}
  flushing=false;if(queue.length)flushT=setTimeout(flush,4000);
}
async function putScores(entries){
  const pin=await ensure('score');if(pin===null)return false;PINS.score=pin;
  entries.forEach(e=>{sc(e.pid)[e.hole]=e.value;qpush(e)});return true;
}

/* ---------- render ---------- */
function render(){
  document.title=C.honoree?C.honoree+"'s 60th":C.title;$('#banner').innerHTML=banner();
  $('#tMatch').classList.toggle('on',tab==='match');$('#tBoard').classList.toggle('on',tab==='board');$('#tResults').classList.toggle('on',tab==='results');
  if(view==='setup')return;
  $('#app').innerHTML=tab==='match'?matchView():tab==='board'?boardView():resultsView();
}
function teamSummary(){
  const T=C.teams.map(t=>({t,c:teamCalc(t.id)}));
  const [a,b]=T;const d=a.c.diff-b.c.diff,fin=a.c.n===OPEN().length&&b.c.n===OPEN().length;
  let lead=d<0?0:d>0?1:-1,how='';
  if(d===0&&fin){const t=a.c.b9-b.c.b9;if(t){lead=t<0?0:1;how='back 9 tiebreaker'}else{const u=a.c.h18-b.c.h18;if(u){lead=u<0?0:1;how='hole 18 tiebreaker'}}}
  let st='All square';
  if(a.c.n===0&&b.c.n===0)st='Waiting for first scores';
  else if(lead<0)st=fin?'Match tied':'All square';
  else{const nm=esc(T[lead].t.name),diff=Math.abs(d);st=fin?(diff?`${nm} wins by ${diff}`:`${nm} wins on ${how}`):`${nm} leads by ${diff}`}
  return{T,st,lead};
}
function summaryCard(){
  const {T,st,lead}=teamSummary();
  const col=i=>{const {t,c}=T[i];return`<div class="t ${lead===i?'lead':''}"><div class="nm ${t.id}">${esc(t.name)}</div><div class="big num ${c.n?cls(c.diff):''}">${c.n?fmtP(c.diff):'–'}</div><div class="sub num">${c.n?`${c.total} net · thru ${c.n}`:'net to par'}</div></div>`};
  return`<div class="card"><div class="vs">${col(0)}<div class="mid">VS</div>${col(1)}</div><div class="status">${st}</div></div>`;
}
function banner(){
  return`<div class="bimg"><img src="banner.jpg" alt="${esc((C.honoree||'')+"'s Birthday Round")}"><div class="bctl"><span class="dot ${SYNC?'':'off'}" id="dot" title="sync"></span><button class="gear" data-act="setup" aria-label="Setup">&#9881;</button></div></div>`;
}
function matchView(){
  if(!isOpen(hole)){hole=nextOpen(hole,1)??nextOpen(hole,-1)??0}
  const h=hole,par=C.par[h],si=eSI(h),all=h===8||h===17;
  let strip='';for(let i=0;i<18;i++)strip+=!isOpen(i)?`<button disabled class="closed">${i+1}</button>`:`<button data-act="goto" data-h="${i}" class="${holeDone(i)?'done':holePart(i)?'part':''} ${i===h?'cur':''}">${i+1}</button>`;

  for(const t of C.teams){
    const ps=C.players.filter(p=>p.team===t.id),tc=teamCalc(t.id),hv=tc.holes[h];
    html+=`<div class="card tc"><h3 class="${t.id}">${esc(t.name)}<span>${hv?`hole: ${hv.val} (${fmtP(hv.val-hv.par)})`:'hole not complete'}</span></h3>`;
    for(const p of ps){
      const v=sc(p.id)[h],stk=strokes(p,h);
      html+=`<div class="prow"><div class="pn"><b>${esc(p.name)}</b><i>${stk?`${'●'.repeat(Math.min(stk,3))} ${stk} stroke${stk>1?'s':''}`:''}${C.cap===false?'':`<span class="muted">${stk?' · ':''}max ${cap(p,hole)}</span>`}</i></div><div class="step"><button data-act="dec" data-p="${p.id}" aria-label="minus">&minus;</button><button class="val num ${v==null?'blank':''}" data-act="par" data-p="${p.id}">${v==null?par:v}</button><button data-act="inc" data-p="${p.id}" aria-label="plus">+</button></div></div>`;
    }
    html+='</div>';
  }
  html+=nextOpen(h,1)!=null?`<button class="bigbtn" data-act="nexthole">Next hole &rarr;</button>`:`<button class="bigbtn" data-act="finish">Finish &amp; see leaderboard</button>`;
  html+=`<p class="muted" style="text-align:center">Tap the number to set par. Blank scores count as par when you tap Next hole.</p>`;
  return html;
}
function boardView(){
  let html=summaryCard();
  // pairs
  html+=`<div class="card"><h2>Blind draw pairs</h2>`;
  if(C.pairs&&C.pairs.length){
    const rows=C.pairs.map(([a,b])=>{const A=pl(a),B=pl(b);if(!A||!B)return null;return{A,B,c:pairCalc(A,B)}}).filter(Boolean).sort((x,y)=>(x.c.n?x.c.diff:99)-(y.c.n?y.c.diff:99)||x.c.b9-y.c.b9||x.c.h18-y.c.h18);
    html+=rows.map((r,i)=>`<div class="pair"><div class="r">${r.c.n?i+1:'–'}</div><div class="n">${esc(r.A.name)} &amp; ${esc(r.B.name)}<small>thru ${r.c.n} · combined net ${r.c.n?r.c.total:'–'}</small></div><div class="s num ${r.c.n?cls(r.c.diff):''}">${r.c.n?fmtP(r.c.diff):'–'}<small>to par</small></div></div>`).join('');
    html+=`<button class="bigbtn sec" data-act="draw" style="margin-top:10px">Redraw pairs</button>`;
  }else{
    html+=`<p class="muted" style="margin-top:0">After the round, draw the 2-man pairs (admin PIN required). Pair score is both players' total net.</p><button class="bigbtn" data-act="draw">Draw blind pairs</button>`;
  }
  html+='</div>';
  // individuals
  const inds=C.players.map(p=>({p,c:indCalc(p)})).sort((x,y)=>(x.c.n?x.c.diff:99)-(y.c.n?y.c.diff:99)||x.c.b9-y.c.b9||x.c.h18-y.c.h18);
  html+=`<div class="card"><h2>Individual net</h2><table class="lb"><tr><th></th><th>Player</th><th>Thru</th><th>Gross</th><th>Net</th><th>+/-</th></tr>${inds.map((r,i)=>`<tr><td>${r.c.n?i+1:'–'}</td><td class="nm">${esc(r.p.name)}<span class="tag ${r.p.team}">${esc(tname(r.p.team))}</span></td><td class="num">${r.c.n||'–'}</td><td class="num">${r.c.n?r.c.gross:'–'}</td><td class="num">${r.c.n?r.c.total:'–'}</td><td class="num ${r.c.n?cls(r.c.diff):''}"><b>${r.c.n?fmtP(r.c.diff):'–'}</b></td></tr>`).join('')}</table></div>`;
  // scorecards
  html+=`<div class="card"><h2>Scorecards</h2>`;
  for(const t of C.teams)html+=`<details><summary class="${t.id}">${esc(t.name)}</summary>${cardTable(t.id)}</details>`;

}
function isFinal(){return C.players.every(p=>OPEN().every(h=>sc(p.id)[h]!=null))}
function resultsView(){

  const any=C.players.some(p=>indCalc(p).n);

  html+=`<div class="card" style="text-align:center"><h2>Team match</h2>${trophy}<div style="font-size:30px;font-weight:900;margin:6px 0" class="${w?w.t.id:''}">${w?esc(w.t.name):'All square'}</div><div class="status" style="margin:0 0 10px">${st}</div><table class="lb">${T.map(x=>`<tr><td></td><td class="nm ${x.t.id}">${esc(x.t.name)}</td><td class="num">${x.c.total} net</td><td class="num ${cls(x.c.diff)}"><b>${fmtP(x.c.diff)}</b></td></tr>`).join('')}</table><div class="muted" style="text-align:left;margin-top:8px">${T.map(x=>`<b class="${x.t.id}">${esc(x.t.name)}:</b> ${C.players.filter(p=>p.team===x.t.id).map(p=>esc(p.name)).join(', ')}`).join('<br>')}</div></div>`;
  // pairs
  html+=`<div class="card"><h2>Blind draw winners</h2>`;
  if(C.pairs&&C.pairs.length){
    const rows=C.pairs.map(([a,b])=>{const A=pl(a),B=pl(b);return A&&B?{A,B,c:pairCalc(A,B)}:null}).filter(Boolean).sort((x,y)=>(x.c.n?x.c.diff:99)-(y.c.n?y.c.diff:99)||x.c.b9-y.c.b9||x.c.h18-y.c.h18);
    html+=rows.map((r,i)=>`<div class="pair"><div class="r">${i===0?'&#127942;':i+1}</div><div class="n">${esc(r.A.name)} &amp; ${esc(r.B.name)}<small>combined net ${r.c.n?r.c.total:'–'}</small></div><div class="s num ${r.c.n?cls(r.c.diff):''}">${r.c.n?fmtP(r.c.diff):'–'}<small>to par</small></div></div>`).join('');
  }else html+=`<p class="muted" style="margin:0">Pairs haven't been drawn yet. Draw them from the Leaderboard tab.</p>`;
  html+='</div>';
  // individual awards
  const inds=C.players.map(p=>({p,c:indCalc(p),bd:C.par.reduce((m,par,h)=>{const g=gr(p,h);return m+(g!=null&&g<par?1:0)},0)})).filter(x=>x.c.n);
  const lowNet=[...inds].sort((x,y)=>x.c.diff-y.c.diff||x.c.b9-y.c.b9||x.c.h18-y.c.h18)[0];
  const lowGross=[...inds].sort((x,y)=>(x.c.gross-x.c.par)-(y.c.gross-y.c.par))[0];
  const mb=[...inds].sort((x,y)=>y.bd-x.bd)[0];
  const aw=(t,x,v)=>`<div class="pair"><div class="n">${t}<small>${esc(x.p.name)}</small></div><div class="s num">${v}</div></div>`;
  html+=`<div class="card"><h2>Awards</h2>${aw('Low net',lowNet,fmtP(lowNet.c.diff))}${aw('Low gross',lowGross,lowGross.c.gross+' ('+fmtP(lowGross.c.gross-lowGross.c.par)+')')}${mb.bd?aw('Most birdies',mb,mb.bd):''}</div>`;
  return html;
}
let cfRun=0;
function confetti(){
  const old=document.getElementById('cf');if(old)old.remove();cfRun++;const id=cfRun;
  const cv=document.createElement('canvas');cv.id='cf';cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:60';
  cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const x=cv.getContext('2d');
  const cols=['#e8b84a','#fff0b8','#ffffff','#5ec4e8','#ff7b9c','#7be0a0'];
  const ps=Array.from({length:170},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,w:5+Math.random()*6,h:8+Math.random()*8,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){if(id!==cfRun)return;const e=t-t0;x.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx+Math.sin(p.y/40);p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=Math.max(0,Math.min(1,(6500-e)/1500));x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(e<6500)requestAnimationFrame(f);else cv.remove()})(t0);
}
function cardTable(tid){
  const ps=C.players.filter(p=>p.team===tid),tc=teamCalc(tid);
  let h='<div class="sc"><table><tr><th>Hole</th>';for(let i=0;i<18;i++)h+=`<th>${i+1}</th>`;h+='<th>Tot</th></tr><tr><th>Par</th>';
  for(let i=0;i<18;i++)h+=`<th>${isOpen(i)?C.par[i]:'–'}</th>`;h+=`<th>${C.par.reduce((a,b,i)=>a+(isOpen(i)?b:0),0)}</th></tr>`;
  for(const p of ps){
    h+=`<tr><td>${esc(p.name)}</td>`;let tot=0,n=0;
    for(let i=0;i<18;i++){if(!isOpen(i)){h+='<td style="opacity:.35">✕</td>';continue}const g=gr(p,i),s=strokes(p,i);if(g==null){h+='<td>·</td>';continue}tot+=g;n++;h+=`<td class="${g<C.par[i]?'u':g>C.par[i]?'o':''}">${g}${s?'<sup>'+(s>1?s:'')+'*</sup>':''}</td>`}
    h+=`<td><b>${n?tot:'–'}</b></td></tr>`;
  }
  h+='<tr class="tm"><td>Team net</td>';
  for(let i=0;i<18;i++){const v=tc.holes[i];h+=`<td>${!isOpen(i)?'✕':v?v.val:'·'}</td>`}
  h+=`<td>${tc.n?tc.total:'–'}</td></tr></table></div><p class="muted">* = handicap stroke on that hole. Team net: best 2 net per hole, all 4 on 9 &amp; 18. Scores capped at net double bogey. Ties: back 9, then hole 18.</p>`;
  return h;
}

function updShots(){
  const closed=Array.from({length:18},(_,i)=>i).filter(i=>$('#cl'+i)&&$('#cl'+i).checked),open=18-closed.length,h=$('#closedHint'),b=$('#usepct');
  if(h){if(closed.length){const sug=Math.floor(open/18*100);h.textContent=`${open} holes open. Stroke index is re-ranked automatically. Suggested handicap %: ${sug}.`;b.style.display='';b.textContent=`Set handicap % to ${sug}`;b.dataset.v=sug}else{h.textContent='';b.style.display='none'}}const pct=+$('#s-pct').value||0;$('#shotsLine').textContent='Playing shots at '+pct+'%: '+C.players.map((p,i)=>$('#pn'+i).value+' '+Math.max(0,Math.round((+$('#ph'+i).value||0)*pct/100))).join(' · ')}
function openSetup(){view='setup';$('#app').style.display='none';$('#over').innerHTML=`<div style="position:relative;z-index:30">${setupView()}</div>`;updShots();scrollTo(0,0)}
function closeSetup(){view=null;$('#over').innerHTML='';$('#app').style.display='';render()}
async function saveSetup(){
  const g=id=>$('#'+id).value;
  const nc={title:g('s-title').trim()||'The 60th Round',course:g('s-course').trim(),sub:g('s-sub').trim(),
    teams:[{id:'A',name:g('s-ta').trim()||'Team A'},{id:'B',name:g('s-tb').trim()||'Team B'}],honoree:g('s-hon').trim(),closed:Array.from({length:18},(_,i)=>i).filter(i=>$('#cl'+i).checked),cap:$('#s-cap').checked,pct:Math.max(0,Math.min(150,Math.round(+g('s-pct')||0))),
    players:C.players.map((p,i)=>({id:p.id,name:g('pn'+i).trim()||p.name,team:g('pt'+i),hcp:Math.max(0,Math.round(+g('ph'+i)||0))})),
    par:Array.from({length:18},(_,i)=>+g('pa'+i)||4),si:Array.from({length:18},(_,i)=>+g('si'+i)||i+1),yds:C.yds,pairs:C.pairs};
  const sis=[...nc.si].sort((a,b)=>a-b).join();
  if(sis!==Array.from({length:18},(_,i)=>i+1).join()&&!confirm('Stroke index values should be 1-18 with no repeats. Save anyway?'))return;
  if(nc.players.filter(p=>p.team==='A').length!==4||nc.players.filter(p=>p.team==='B').length!==4)if(!confirm('Teams are not 4 and 4. Save anyway?'))return;
  const pin=await ensure('admin');if(pin===null)return;
  try{await api('config',{pin,config:nc});C=nc;lastSig='';closeSetup();load();toast('Saved')}
  catch(e){if(e.status===401){PINS.admin='';localStorage.removeItem('r60admin');toast('Wrong PIN')}else toast('Could not save')}
}

async function clearScores(){
  if(!confirm('Clear ALL scores? This cannot be undone.'))return;
  const pin=await ensure('admin');if(pin===null)return;
  try{await api('reset',{pin,pairs:true});S={};C.pairs=null;lastSig='';closeSetup();load();toast('Cleared')}catch(e){toast('Could not clear')}

function sampleScores(){

async function drawPairs(){
  const unfinished=!isFinal();
  if(C.pairs&&!confirm('Redraw the pairs?'))return;
  if(unfinished&&!confirm('Not all holes are scored yet. Draw anyway?'))return;
  const pin=await ensure('admin');if(pin===null)return;
  let pairs;
  try{pairs=(await api('draw',{pin})).pairs}catch(e){if(e.status===401){PINS.admin='';localStorage.removeItem('r60admin');toast('Wrong PIN')}else toast('Could not draw');return}

  C=nc;lastSig='';
  $('#over').innerHTML=`<div class="ov"><h2>The Blind Draw</h2>${pairs.map(([a,b],i)=>`<div class="pr" style="animation-delay:${i*1.1}s">${esc(pl(a).name)} &amp; ${esc(pl(b).name)}</div>`).join('')}<button class="bigbtn" style="max-width:420px;margin:24px auto 0;animation:in .6s ${pairs.length*1.1}s forwards;opacity:0" data-act="closeov">Done</button></div>`;

}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,p=el.dataset.p;
  if(a==='tab'){tab=el.dataset.t;render();scrollTo(0,0);if(tab==='results'&&isFinal())setTimeout(confetti,250)}
  else if(a==='confetti')confetti();
  else if(a==='setup'){if((await ensure('admin'))!==null)openSetup()}
  else if(a==='close')closeSetup();
  else if(a==='save')saveSetup();
  else if(a==='preset')loadPreset();
  else if(a==='usepct'){$('#s-pct').value=el.dataset.v;updShots()}
  else if(a==='clear')clearScores();
  else if(a==='sample')sampleScores();
  else if(a==='draw')drawPairs();
  else if(a==='closeov'){$('#over').innerHTML=''}
  else if(a==='goto'){hole=+el.dataset.h;render()}
  else if(a==='prev'){const n=nextOpen(hole,-1);if(n!=null)hole=n;render()}
  else if(a==='next1'){const n=nextOpen(hole,1);if(n!=null)hole=n;render()}
  else if(a==='inc'||a==='dec'){
    const par=C.par[hole],cur=sc(p)[hole],base=cur==null?par:cur,v=Math.max(1,Math.min(20,base+(a==='inc'?1:-1)));
    if(a==='inc'&&cur!=null&&cur>=cap(pl(p),hole)){toast('Max is net double bogey');return}
    if(await putScores([{pid:p,hole,value:Math.min(v,cap(pl(p),hole))}]))render();
  }
  else if(a==='par'){if(await putScores([{pid:p,hole,value:C.par[hole]}]))render()}
  else if(a==='nexthole'||a==='finish'){
    const ents=C.players.filter(q=>sc(q.id)[hole]==null).map(q=>({pid:q.id,hole,value:C.par[hole]}));
    if(ents.length&&!(await putScores(ents)))return;
    if(a==='finish'){tab='board'}else hole=nextOpen(hole,1)??hole;
    render();scrollTo(0,0);
  }
});
setInterval(()=>{if(!document.hidden&&view!=='setup'&&!flushing)load()},10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();flush()}});
window.addEventListener('online',()=>{load();flush()});
load();
</script>
